<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />

  <!-- Gold Store Canopy Roof -->
  <path d="M 22 40 L 27 26 L 73 26 L 78 40 Z" fill="url(#goldGrad)" filter="url(#dropShadow)" />
  <path d="M 22 40 C 22 43.5 24.5 46 27.5 46 C 30.5 46 32.5 43.5 32.5 40 C 32.5 43.5 35 46 38 46 C 41 46 43 43.5 43 40 C 43 43.5 45.5 46 48.5 46 C 51.5 46 53.5 43.5 53.5 40 C 53.5 43.5 56 46 59 46 C 62 46 64 43.5 64 40 C 64 43.5 66.5 46 69.5 46 C 72.5 46 75 43.5 75 40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Store Front Frame -->
  <rect x="25" y="44" width="50" height="32" rx="4" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="3" />
  
  <!-- Store Door -->
  <path d="M 40 76 V 58 H 60 V 76" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Kirana Wheat Grain / Leaf Accents -->
  <path d="M 16 68 C 18 63 20 58 24 55 M 16 68 C 17 64 19 62 23 62 M 16 68 C 15 64 13 62 9 62" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M 84 68 C 82 63 80 58 76 55 M 84 68 C 83 64 81 62 77 62 M 84 68 C 85 64 87 62 91 62" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
</svg>