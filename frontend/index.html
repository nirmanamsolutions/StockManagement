<!doctype html>
<html lang="mr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>शिवरत्न किराणा &amp; जनरल स्टोअर्स खंडोबाचीवाडी</title>
  </head>
  <body>
    <div id="app-preloader" style="position: fixed; inset: 0; z-index: 99999; background: #f7f7f6; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: system-ui, -apple-system, sans-serif;">
      <div style="width: 100%; position: fixed; top: 0; left: 0; height: 4px; background: rgba(67, 56, 202, 0.12); overflow: hidden;">
        <div style="height: 100%; width: 50%; background: linear-gradient(90deg, #4338ca, #d97706); animation: preloaderBar 1.2s infinite ease-in-out;"></div>
      </div>
      <div style="background: #ffffff; padding: 2.5rem 2rem; border-radius: 24px; box-shadow: 0 12px 24px -4px rgba(67,56,202,0.14); text-align: center; border: 1px solid rgba(67,56,202,0.12); max-width: 360px; width: 90%;">
        <div style="position: relative; width: 56px; height: 56px; margin: 0 auto 1.25rem;">
          <div style="position: absolute; inset: 0; border: 4px solid #e0e7ff; border-top-color: #4338ca; border-radius: 50%; animation: preloaderSpin 0.8s linear infinite;"></div>
          <svg style="position: absolute; inset: 0; margin: auto; color: #4338ca;" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/>
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/>
            <path d="M2 7h20"/>
          </svg>
        </div>
        <h3 style="font-size: 1.15rem; font-weight: 800; color: #1c1917; margin: 0 0 0.4rem 0;">शिवरत्न किराणा &amp; जनरल स्टोअर्स</h3>
        <p style="font-size: 0.85rem; font-weight: 600; color: #78716c; margin: 0;">सिस्टम लोड होत आहे...</p>
      </div>
      <style>
        @keyframes preloaderSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes preloaderBar { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
      </style>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
